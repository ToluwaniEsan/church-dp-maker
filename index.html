  else { c.drawImage(designImg,0,0); drawPhoto(c,r,opts.placeholder); }
  if(S.ring>0){ c.save(); pathFrame(c,r); c.lineWidth=S.ring*r.W/1080; c.strokeStyle=S.ringColor; c.stroke(); c.restore(); }
  lastNameBox = drawName(c, opts);
  if(opts.overlay && lastNameBox){
    const lw=Math.max(2, r.W/360), b=lastNameBox; c.save(); c.setLineDash([lw*4,lw*3]);
    c.lineWidth=lw*2.2; c.strokeStyle='rgba(0,0,0,0.55)'; c.strokeRect(b.x,b.y,b.w,b.h);
    c.lineWidth=lw; c.strokeStyle='#FFFFFF'; c.strokeRect(b.x,b.y,b.w,b.h); c.restore();
  }
  if(opts.overlay){
    const lw=Math.max(2, r.W/360); c.save(); pathFrame(c,r);
    c.lineWidth=lw*2.2; c.strokeStyle='rgba(0,0,0,0.55)'; c.stroke();
    c.setLineDash([lw*5,lw*4]); c.lineWidth=lw; c.strokeStyle='#FFFFFF'; c.stroke(); c.restore();
  }
}
function drawName(c, opts){
  if(!S.nameOn) return null;
  const W=designImg.naturalWidth, H=designImg.naturalHeight;
  const real = memberName.trim();
  const text = real || (opts.placeholder ? 'Your Name' : '');
  let fs = S.nameSize*W/1080;
  c.save(); c.font=fontCss(fs);
  let w = c.measureText(text || 'Your Name').width;
  if(w > W*0.92){ fs = fs*(W*0.92)/w; c.font=fontCss(fs); w=W*0.92; }
  const cx=S.nx*W, cy=S.ny*H;
  if(text){
    c.textAlign='center'; c.textBaseline='middle'; c.fillStyle=S.nameColor;
    c.globalAlpha = real ? 1 : 0.45;
    c.shadowColor='rgba(0,0,0,0.35)'; c.shadowBlur=fs*0.15; c.shadowOffsetY=fs*0.04;
    c.fillText(text, cx, cy);
  }
  c.restore();
  const pad=fs*0.25;
  return {x:cx-w/2-pad, y:cy-fs*0.62-pad, w:w+pad*2, h:fs*1.24+pad*2};
}
function render(){ if(!designImg) return; compose(ctx,{placeholder:true, overlay: mode==='setup'}); }

function updateUI(){
  setText();
  $('chip').hidden = !!S.design;
  $('member').hidden = mode!=='member'; $('setup').hidden = mode!=='setup';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===mode)));
  $('hint').textContent = mode==='setup' ? 'Drag the dashed frame to where the photo should go.' : (photo ? 'Drag your photo to move it inside the frame.' : 'Your photo will appear in the frame.');
  ['adjust','dl'].forEach(id=>$(id).disabled=!photo);
  $('dirty').hidden = !dirty;
  $('m-name-wrap').hidden = !S.nameOn; $('f-nameon').checked = !!S.nameOn; $('name-opts').hidden = !S.nameOn;
  $('f-namesize').value = S.nameSize; $('f-namec').value = S.nameColor;
  $('f-namefont').value = S.nameFont;
  $('save').hidden = !inClaude;
  $('gh-pub').hidden = inClaude;
  $('savemsg').hidden = !inClaude;
  $('tabs').hidden = !(canEdit || isSetupHash());
  $('f-title').value = S.title; $('f-sub').value = S.subtitle; $('f-size').value = S.size;
  $('f-ring').value = S.ring; $('f-ringc').value = S.ringColor; $('f-layer').value = S.layer;
  document.querySelectorAll('input[name=shape]').forEach(i=>i.checked = i.value===S.shape);
}
function changed(){ dirty=true; updateUI(); render(); }

// Pointer: move frame (setup) or pan photo (member)
cv.addEventListener('pointerdown', e=>{
  if(mode==='member' && !photo) return;
  const rect=cv.getBoundingClientRect(), k=cv.width/rect.width;
  const px=(e.clientX-rect.left)*k, py=(e.clientY-rect.top)*k, b=lastNameBox;
  const onName = mode==='setup' && b && px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h;
  cv.setPointerCapture(e.pointerId); drag={x:e.clientX,y:e.clientY,target:onName?'name':'frame'};
});
cv.addEventListener('pointermove', e=>{
  if(!drag) return; const k=cv.width/cv.getBoundingClientRect().width;
  const dx=(e.clientX-drag.x)*k, dy=(e.clientY-drag.y)*k; drag.x=e.clientX; drag.y=e.clientY;
  if(mode==='setup' && drag.target==='name'){ const W=designImg.naturalWidth,H=designImg.naturalHeight;
    S.nx=Math.min(1,Math.max(0,S.nx+dx/W)); S.ny=Math.min(1,Math.max(0,S.ny+dy/H)); dirty=true; $('dirty').hidden=false; }
  else if(mode==='setup'){ const r=frameRect();
    S.cx=Math.min(1,Math.max(0,S.cx+dx/r.W)); S.cy=Math.min(1,Math.max(0,S.cy+dy/r.H)); dirty=true; $('dirty').hidden=false; }
  else { const fw=frameRect().w; ox+=dx/fw; oy+=dy/fw; }
  render();
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{ drag=null; }));
cv.addEventListener('wheel', e=>{ if(mode!=='member'||!photo) return; e.preventDefault(); zoom=Math.min(5,Math.max(1,zoom*(e.deltaY<0?1.06:1/1.06))); render(); },{passive:false});

// ---- Photo adjuster (opens after taking or choosing a photo) ----
const cc=$('cc'), cx2=cc.getContext('2d');
let cImg=null, cZoom=1, cO={x:0,y:0}, cPtrs=new Map(), cPinch=null, cPrevFocus=null;
function cFrame(){ const S2=cc.width, f=S2*0.76; return {x:(S2-f)/2, y:(S2-f)/2, w:f, h:f}; }
function cDraw(){
  if(!cImg) return;
  const dpr=Math.min(3,window.devicePixelRatio||1), size=Math.round(cc.clientWidth*dpr)||600;
  if(cc.width!==size){ cc.width=size; cc.height=size; }
  const r=cFrame(), b=fitBox(cImg,r,cZoom,cO);
  cx2.clearRect(0,0,size,size); cx2.drawImage(cImg,b.x,b.y,b.w,b.h);
  cx2.save(); cx2.beginPath(); cx2.rect(0,0,size,size); addFrame(cx2,r); cx2.fillStyle='rgba(10,6,18,0.6)'; cx2.fill('evenodd'); cx2.restore();
  cx2.save(); pathFrame(cx2,r); cx2.lineWidth=2*dpr; cx2.strokeStyle='#FFFFFF'; cx2.stroke(); cx2.restore();
  $('c-zoom').value=cZoom;
}
function openCrop(img, z, o){
  cImg=img; cZoom=z; cO={x:o.x,y:o.y}; cPtrs.clear(); cPinch=null;
  cPrevFocus=document.activeElement; $('crop').hidden=false; document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{ cDraw(); $('c-ok').focus(); });
}
function closeCrop(){ $('crop').hidden=true; document.body.style.overflow=''; cImg=null; if(cPrevFocus&&cPrevFocus.focus) cPrevFocus.focus(); }
const cPt = e => { const rc=cc.getBoundingClientRect(), k=cc.width/rc.width; return {x:(e.clientX-rc.left)*k, y:(e.clientY-rc.top)*k}; };
cc.addEventListener('pointerdown', e=>{ cc.setPointerCapture(e.pointerId); cPtrs.set(e.pointerId,cPt(e)); cPinch=null; });
cc.addEventListener('pointermove', e=>{
  if(!cPtrs.has(e.pointerId)) return;
  const prev=cPtrs.get(e.pointerId), now=cPt(e); cPtrs.set(e.pointerId,now);
  const fw=cFrame().w;
  if(cPtrs.size===1){ cO.x+=(now.x-prev.x)/fw; cO.y+=(now.y-prev.y)/fw; }
  else if(cPtrs.size===2){
    const [a,b]=[...cPtrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y), m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(cPinch){ cZoom=Math.min(5,Math.max(1,cZoom*d/cPinch.d)); cO.x+=(m.x-cPinch.m.x)/fw; cO.y+=(m.y-cPinch.m.y)/fw; }
    cPinch={d,m};
  }
  cDraw();
});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>cc.addEventListener(t,e=>{ cPtrs.delete(e.pointerId); cPinch=null; }));
cc.addEventListener('wheel', e=>{ e.preventDefault(); cZoom=Math.min(5,Math.max(1,cZoom*(e.deltaY<0?1.06:1/1.06))); cDraw(); },{passive:false});
$('c-zoom').addEventListener('input', e=>{ cZoom=+e.target.value; cDraw(); });
$('c-cancel').addEventListener('click', closeCrop);
$('c-ok').addEventListener('click', ()=>{ photo=cImg; zoom=cZoom; ox=cO.x; oy=cO.y; closeCrop(); $('fallback').hidden=true; updateUI(); render(); });
$('crop').addEventListener('keydown', e=>{ if(e.key==='Escape') closeCrop(); });
window.addEventListener('resize', ()=>{ if(!$('crop').hidden) cDraw(); });
$('adjust').addEventListener('click', ()=>{ if(photo) openCrop(photo, zoom, {x:ox,y:oy}); });

['photo','photo-cam'].forEach(id=>$(id).addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ openCrop(await loadImg(URL.createObjectURL(f)), 1, {x:0,y:0}); }
  catch(err){ toast('That file could not be opened. Try a JPG or PNG photo.'); }
}));
$('m-name').addEventListener('input', e=>{ memberName=e.target.value; render(); });
$('f-nameon').addEventListener('change', e=>{ S.nameOn=e.target.checked; changed(); });
$('f-namesize').addEventListener('input', e=>{ S.nameSize=+e.target.value; dirty=true; $('dirty').hidden=false; render(); });
$('f-namec').addEventListener('input', e=>{ S.nameColor=e.target.value; dirty=true; $('dirty').hidden=false; render(); });
$('f-namefont').innerHTML = Object.entries(FONTS).map(([k,f])=>`<option value="${k}">${f.label}</option>`).join('');
$('f-namefont').addEventListener('change', async e=>{
  S.nameFont=e.target.value; dirty=true;
  try{ await Promise.race([document.fonts.load(fontCss(60)), new Promise(r=>setTimeout(r,1500))]); }catch(err){}
  updateUI(); render();
});
try{ $('gh-token').value = localStorage.getItem('dp-gh-token') || ''; }catch(e){}
$('gh-publish').addEventListener('click', async ()=>{
  const msg=$('gh-msg'), btn=$('gh-publish'), token=$('gh-token').value.trim();
  if(!GH){ msg.textContent='Publishing works on the GitHub Pages link.'; return; }
  if(!token){ msg.textContent='Paste your GitHub access token first.'; $('gh-token').focus(); return; }
  try{ localStorage.setItem('dp-gh-token', token); }catch(e){}
  btn.disabled=true; msg.textContent='Publishing…';
  try{
    const v=Date.now(), cfg=Object.assign({}, S);
    if(designChanged || (S.design||'').startsWith('data:')){
      const m=/^data:image\/(\w+);base64,(.*)$/.exec(S.design||'');
      if(m){ const ext=m[1]==='jpeg'?'jpg':m[1]; await ghPut(token,'design.'+ext,m[2],'Update design'); cfg.design='design.'+ext+'?v='+v; }
    }
    const pc=document.createElement('canvas'); const savedPhoto=photo, savedName=memberName; photo=null; memberName='';
    compose(pc.getContext('2d'),{placeholder:true,overlay:false}); photo=savedPhoto; memberName=savedName;
    const sm=document.createElement('canvas'), sc=Math.min(1,1200/pc.width); sm.width=Math.round(pc.width*sc); sm.height=Math.round(pc.height*sc);
    sm.getContext('2d').drawImage(pc,0,0,sm.width,sm.height);
    await ghPut(token,'preview.jpg', await blobB64(await new Promise(r=>sm.toBlob(r,'image/jpeg',0.85))), 'Update link preview');
    await ghPut(token,'config.json', b64utf8(JSON.stringify(cfg,null,2)), 'Update settings');
    S.design=cfg.design; designChanged=false; dirty=false;
    msg.textContent='Published. The live link shows your changes in about a minute.';
  }catch(err){
    msg.textContent = err===401 ? 'GitHub did not accept that token. Check it and paste it again.'
      : (err===403||err===404) ? 'That token cannot change this repo. Give it Contents: Read and write on church-dp-maker.'
      : 'Publishing failed. Check your connection and try again.';
  }
  btn.disabled=false; updateUI();
});
window.addEventListener('hashchange', ()=>{ if(isSetupHash()) mode='setup'; updateUI(); render(); });
$('export').addEventListener('click', async ()=>{
  if(!inClaude){
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buildDoc()],{type:'text/html'})); a.download='index.html';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    toast('Website file downloaded'); return;
  }
  let dlns=null; try{ dlns = inClaude ? await window.claude.use('downloads') : null; }catch(e){}
  if(!dlns){ toast('Downloads are not available here. Open the page directly on claude.ai.'); return; }
  try{ await dlns.save({filename:'index.html', data:new Blob([buildDoc()],{type:'text/html'})}); toast('Website file downloaded'); }
  catch(err){ if(!(err && err.code==='declined')) toast('The file could not be downloaded. Try again.'); }
});

$('dl').addEventListener('click', async ()=>{
  if(!photo) return;
  const out=document.createElement('canvas'); compose(out.getContext('2d'),{placeholder:false,overlay:false});
  const blob = await new Promise(r=>out.toBlob(r,'image/jpeg',0.93));
  const name=(S.title||'my').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-dp.jpg';
  if(!inClaude){
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    toast('Downloaded'); return;
  }
  let dlns=null; try{ dlns = await window.claude.use('downloads'); }catch(e){}
  if(dlns){
    try{ await dlns.save({filename:name, data:blob}); toast('Downloaded'); return; }
    catch(err){ if(err && err.code==='declined') return; }
  }
  const img=$('outimg'); if(img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
  img.src=URL.createObjectURL(blob); $('fallback').hidden=false;
  $('fallback').scrollIntoView({behavior:'smooth',block:'nearest'});
});

// Setup controls
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{ mode=b.dataset.mode; updateUI(); render(); }));
$('f-title').addEventListener('input', e=>{ S.title=e.target.value; dirty=true; $('dirty').hidden=false; setText(); });
$('f-sub').addEventListener('input', e=>{ S.subtitle=e.target.value; dirty=true; $('dirty').hidden=false; setText(); });
$('f-size').addEventListener('input', e=>{ S.size=+e.target.value; dirty=true; $('dirty').hidden=false; render(); });
$('f-ring').addEventListener('input', e=>{ S.ring=+e.target.value; dirty=true; $('dirty').hidden=false; render(); });
$('f-ringc').addEventListener('input', e=>{ S.ringColor=e.target.value; dirty=true; $('dirty').hidden=false; render(); });
$('f-layer').addEventListener('change', e=>{ S.layer=e.target.value; changed(); });
document.querySelectorAll('input[name=shape]').forEach(i=>i.addEventListener('change',()=>{ S.shape=i.value; changed(); }));

$('design').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const src=await loadImg(URL.createObjectURL(f));
    const max=2000, sc=Math.min(1, max/Math.max(src.naturalWidth,src.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(src.naturalWidth*sc); c.height=Math.round(src.naturalHeight*sc);
    c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    const keepPng = f.type==='image/png' && S.layer==='behind';
    let url = keepPng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg',0.9);
    if(url.length > 11e6) url = c.toDataURL('image/jpeg',0.85);
    S.design=url; designChanged=true; designImg=await loadImg(url); ox=0; oy=0; changed();
    toast('Design added. Now place the frame.');
  }catch(err){ toast('That design could not be opened. Use a PNG or JPG.'); }
});

function buildDoc(){
  const reset = document.head.querySelector('style')?.textContent || ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  const json = JSON.stringify(S).replace(/</g,'\\u003c');
  const fonts = document.querySelector('link[href*="fonts.googleapis"]')?.getAttribute('href') || '';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    + '<title>Church DP Maker</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    + (fonts ? '<link rel="stylesheet" href="'+fonts.replace(/"/g,'&quot;')+'">\n' : '')
    + '<style id="app-css">'+$('app-css').textContent+'</style>\n<div id="app"></div>\n'
    + '<script type="application/json" id="dp-state">'+json+'<\/script>\n'
    + '<script id="app-js">'+$('app-js').textContent+'<\/script>'
    + '</body></html>';
}

$('save').addEventListener('click', async ()=>{
  const btn=$('save'), msg=$('savemsg'); btn.disabled=true; msg.textContent='Saving…';
  let art=null; try{ art = window.claude?.use ? await window.claude.use('artifact') : null; }catch(e){}
  if(!art){ msg.textContent='Saving only works on the published page, for people with edit access.'; btn.disabled=false; return; }
  try{ await art.publish(buildDoc()); dirty=false; msg.textContent='Saved. Members will see this design.'; }
  catch(err){
    const c=err&&err.code;
    msg.textContent = c==='conflict' ? 'Someone else saved at the same time, so the page reloaded with their version.'
      : c==='too_large' ? 'The design is too large to save. Upload a smaller image.'
      : (c==='not_writer'||c==='not_granted') ? 'You do not have edit access to save this design.'
      : 'Saving failed. Try again in a moment.';
  }
  btn.disabled=false; updateUI();
});

(async function init(){
  setText(); updateUI();
  try{ await Promise.race([Promise.all([document.fonts.load('800 60px "Bricolage Grotesque"'), document.fonts.load(fontCss(60))]), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  if(!inClaude){
    try{ const r=await fetch('config.json?v='+Date.now(),{cache:'no-store'}); if(r.ok){ Object.assign(S, await r.json()); setText(); } }catch(e){}
  }
  if(isSetupHash()){ mode='setup'; }
  updateUI();
  designImg = await loadImg(S.design || await sampleDesign());
  render();
  try{
    const user = window.claude?.use ? await window.claude.use('user') : null;
    canEdit = user ? await user.canEdit() : false;
  }catch(e){ canEdit=false; }
  updateUI();
})();
})();
</script>
</body></html>
